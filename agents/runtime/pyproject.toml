[project]
name = "cowork-agent"
version = "0.1.0"
description = "CoWork Python agent runtime — loop, tools, state, model client."
requires-python = ">=3.12"
dependencies = [
    "firecrawl-anydoc>=0.1.8",
    "httpx>=0.27",
    "mcp>=2.0.0",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cowork_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the real account and spends credits; skipped unless the live env vars are set",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
