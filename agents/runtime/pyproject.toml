[project]
name = "cowork-agent"
version = "0.1.0"
description = "CoWork Python agent runtime — loop, tools, state, model client."
requires-python = ">=3.12"
dependencies = [
    "firecrawl-anydoc>=0.1.8",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The browser fallback (§8/§9). Optional on purpose: browser-use pulls the
# provider SDKs (openai, anthropic, google-genai, groq, ollama) plus cdp-use and
# browser-harness, and it is useless without a Chromium binary. `browser_task`
# gates itself on the import through `check_fn`, so the runtime is complete
# without this extra. MIT, requires Python >= 3.11.
browser = [
    "browser-use>=0.13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cowork_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits the real account and spends credits; skipped unless the live env vars are set",
]
