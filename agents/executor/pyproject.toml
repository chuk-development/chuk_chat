[project]
name = "chuk-agents-executor"
version = "0.1.0"
description = "Agents executor vertical: agent loop + sandbox + encrypted frames, wired over a loopback transport behind the Manager's supervisor."
readme = "README.md"
authors = [
    { name = "chukfinley", email = "chuk@chuk.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "chuk-agents-runtime",
    "chuk-agents-sandbox",
    "chuk-agents-crypto",
    "chuk-agents-manager",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
chuk-agents-runtime = { path = "../agent", editable = true }
chuk-agents-sandbox = { path = "../sandbox", editable = true }
chuk-agents-crypto = { path = "../common/chuk_agents_crypto", editable = true }
chuk-agents-manager = { path = "../manager", editable = true }

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
