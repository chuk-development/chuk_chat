[project]
name = "chuk-agents-bench"
version = "0.1.0"
description = "Speed test for Agents turns: run timings from a state DB copy, an offline replay of the prepare pipeline, and an opt-in live run."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chuk-agents-runtime",
]

[project.scripts]
agents-bench = "chuk_agents_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

# Editable: the offline replay imports the runtime from THIS checkout, so a fix
# in agents/runtime shows up in the next bench run with no reinstall.
[tool.uv.sources]
chuk-agents-runtime = { path = "../runtime", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chuk_agents_bench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
