description: Implementation of The Remote Framebuffer Protocol (RFC 6143, aka VNC protocol)
name: dart_rfb
repository: https://github.com/Goddchen/dart-rfb
version: 0.7.0
publish_to: none # vendored fork, lives in the app repo

environment:
  sdk: ">=2.18.4 <3.0.0"

# Agents vendored fork (see app/pubspec.yaml): adds the Tight encoding. The
# upstream dev_dependencies (build_runner/freezed/mockito/test) are dropped on
# purpose — the committed *.freezed.dart files are used as-is and no codegen
# runs, and their pins no longer resolve against the current SDK.
dependencies:
  binary: ^3.0.1
  collection: ^1.16.0
  dart_des: ^1.0.2
  fpdart: ^0.4.0
  freezed_annotation: ^2.2.0
  # Pure-Dart JPEG decode for Tight's JPEG rectangles; runs in the client's
  # background isolate where dart:ui image codecs are not available.
  image: ^4.5.0
  logging: ^1.1.0
