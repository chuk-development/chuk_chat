name: chuk_chat
description: "Chuk Chat — AI chat client for all platforms."
publish_to: 'none'

version: 1.0.109

environment:
  sdk: ^3.9.2

# SDK ceiling — why several deps are held back
# ---------------------------------------------
# CI pins Flutter 3.41.4 (Dart 3.11.1) for every platform except the Android job,
# which pins 3.38.7 (Dart 3.10.7). The ceiling exists because re_editor 0.8.0
# (pulled in by vendor/markdraw) breaks on Flutter >= 3.44. Do not float CI on `stable`.
#
# Consequence: anything needing Dart >= 3.12 / Flutter >= 3.44 is unreachable —
# pdf 3.13, printing 5.15, sqflite 2.4.3, sqflite_common_ffi 2.4.2, record 7.
# These unblock together once re_editor is resolved; they are not individually broken.
#
# Also: keep constraint FLOORS low. The Android job (Dart 3.10.7) ignores pubspec.lock
# and re-resolves, downgrading anything needing Dart 3.11 (e.g. add_2_calendar 3.1.1 ->
# 3.0.1, pdfrx -> the ^2.2.24 floor). Raising a floor to a Dart-3.11-only version makes
# that job unsolvable, since pub cannot downgrade below a declared floor. Every floor
# raised here resolves on Dart 3.10.7 / Flutter 3.38.1.
#
# Second ceiling, from the other direction: Flutter 3.41 is too OLD for plugins whose
# Gradle script uses a top-level `kotlin { compilerOptions }` block without applying the
# Kotlin plugin — Flutter's plugin loader does not apply it, so the script fails to
# compile. dynamic_color 1.9.0, add_2_calendar 3.1.1 and permission_handler_android 14
# are all capped for this reason; they unblock together on a newer Flutter.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1  # State management for chat runtime / streaming (perf re-architecture)
  # Material You / system accent colour (Android 12+, some desktops).
  # Capped below 1.9.0 for the same reason as add_2_calendar: 1.9.0 uses a
  # top-level `kotlin { compilerOptions }` block in its own Gradle script without
  # applying the Kotlin plugin, and Flutter's plugin loader does not apply it for
  # them, so the script fails to compile.
  dynamic_color: ">=1.7.0 <1.9.0"
  web: ^1.1.1
  shared_preferences: ^2.5.3
  http: ^1.5.0
  dio: ^5.4.0
  flutter_svg: ^2.2.2
  file_picker: ^12.0.0  # federated rewrite; drops the win32 ^5 pin that blocked share_plus/package_info_plus/geolocator
  image_picker: ^1.1.2
  uuid: ^4.5.2
  # Held at 12.x: permission_handler_android 14.0.0 (pulled by 13.0.1) has the
  # same unusable Gradle script as dynamic_color 1.9.0 — a top-level
  # `kotlin { compilerOptions }` block with no Kotlin plugin applied.
  permission_handler: ">=12.0.1 <13.0.0"
  supabase_flutter: ^2.10.3
  crypto: ^3.0.6
  cryptography: ^2.7.0
  # Held at 10.x: 11.0.0 compiles against API 37, and API 37 needs AGP 9.1 /
  # Gradle 9.3 — a toolchain jump this app is not on. 10.3.1 already migrated
  # the ciphers, so the move to 11 is free whenever the toolchain catches up.
  flutter_secure_storage: ">=10.0.0 <11.0.0"
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  record: ^6.1.2  # 7.x needs Dart ^3.12 / Flutter >=3.44 — see SDK ceiling note above.
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  markdown_widget: ^2.3.2+8
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.2
  highlight: ^0.7.0
  web_socket_channel: ^3.0.1
  archive: ^4.0.7
  yaml: ^3.1.3  # SKILL.md frontmatter — already in the tree via pdfrx
  desktop_drop: ^0.7.0
  tray_manager: ^0.5.1
  window_manager: ^0.5.1
  image: ^4.8.0  # 4.9.x needs xml ^7; blocked by enough_mail (xml ^6)
  pdfx: ^2.8.0  # PDF viewing (mobile/macOS — used by workspace viewer)
  pdfrx: ^2.2.24  # Cross-platform PDF viewing incl. Linux/Windows (PDFium)
  pdf: ^3.11.0  # PDF generation (export markdown responses). 3.13.0 needs Dart >=3.12 — see SDK ceiling note above.
  printing: ^5.13.0  # Cross-platform PDF share/print/save. 5.15.0 needs Dart >=3.12 / Flutter >=3.41 — see SDK ceiling note above.
  flutter_foreground_task: ^10.0.0  # Keep streaming alive when app backgrounded
  # 10.0.0 is a floor-only major: no Dart API changes, no migration steps.
  # Needs Flutter >=3.38.0 — satisfied by both CI pins (android 3.38.7, rest 3.41.4).
  flutter_local_notifications: ^22.0.0  # Completion notifications with deep linking
  pasteboard: ^0.5.0
  flutter_map: ^8.3.0          # Map widget for displaying locations/routes
  latlong2: ^0.10.1             # Coordinate math (LatLng type) — flutter_map 8.3.1 widened to >=0.9.1 <0.11.0
  fl_chart: ^1.1.1              # Chart rendering (bar, line, pie, scatter, radar)
  geolocator: ^14.0.3
  # Native calendar event creation. Capped below 3.1.0: that release's own
  # android/build.gradle.kts uses a top-level `kotlin { compilerOptions }` block
  # without applying the Kotlin plugin, so it only compiles under AGP 9 / Kotlin
  # 2.3.20. Any local Android build resolving 3.1.1 fails at Gradle script
  # compilation. The Android CI job never hit it because it re-resolves down to
  # 3.0.1 on Dart 3.10.7.
  add_2_calendar: ">=3.0.1 <3.1.0"
  enough_mail: ^2.1.6           # IMAP/SMTP email
  timezone: ^0.11.0             # Timezone data for notifications
  pretty_qr_code: ^3.6.0
  sqflite: ^2.4.2  # 2.4.3 needs Dart ^3.12 / Flutter >=3.44 — see SDK ceiling note above.
  sqflite_common_ffi: ^2.4.0+2  # 2.4.2 needs Dart ^3.12 — see SDK ceiling note above.
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
  # System-WebView renderer for HTML artifacts on
  # Android/iOS/macOS/Windows/Web. Linux has no stable federation for
  # this plugin, so the desktop Linux build falls back to a source view.
  # A separate "-full" Linux artifact built via CI injects `webview_cef`
  # (CEF/Chromium) for real HTML rendering. See .github/workflows and
  # ci/linux_full/ for the swap-in files.
  flutter_inappwebview: ^6.1.5
  # Native cross-platform Excalidraw-compatible drawing widget. Replaces
  # the old WebView-based renderer — works on every Flutter platform
  # without bundling Chromium or shipping the official Excalidraw bundle.
  #
  # Vendored from pub.dev markdraw 0.2.0 (see vendor/markdraw/). Patched
  # to relax file_picker / google_fonts constraints and to no-op
  # MarkdrawFileHandler (incompatible with file_picker ^11 API). Upgrading
  # markdraw requires re-vendoring + re-applying these patches.
  markdraw:
    path: vendor/markdraw

# super_native_extensions (via markdraw -> super_clipboard) caps device_info_plus
# at <12.0.0, which pins win32 to 5.x and blocks file_picker 12, share_plus 13,
# package_info_plus 10 and geolocator 14.0.3. It only reads
# `AndroidDeviceInfo.version.sdkInt`, an API unchanged in 12 and 13, so the cap is
# stale rather than real. Drop this override once super_clipboard widens its range.
dependency_overrides:
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/wordmark.svg
    - assets/icons/
    - assets/icons/chuk_chat_tray_brand.png
    - assets/mcp_icons/
    - web/icons/Icon-512.png
    - windows/runner/resources/app_icon.ico
  # The three selectable chat fonts, bundled locally (previously fetched at
  # runtime by google_fonts, which baked a ~7.8 MB font metadata table into the
  # release snapshot). Arimo and JetBrains Mono are variable fonts (the wght
  # axis covers every weight); Merriweather ships as static regular/bold weights.
  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-wght.ttf
        - asset: assets/fonts/Arimo-Italic-wght.ttf
          style: italic
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-wght.ttf
        - asset: assets/fonts/JetBrainsMono-Italic-wght.ttf
          style: italic

msix_config:
  display_name: chuk_chat
  publisher_display_name: chuk Development
  identity_name: chuk.chat
  publisher: CN=chuk Development
  msix_version: 1.0.0.0
  logo_path: web/icons/Icon-512.png
  capabilities: internetClient
  store: false
