name: chuk_chat
description: "Chuk Chat — AI chat client for all platforms."
publish_to: 'none'

version: 1.0.108

environment:
  sdk: ^3.9.2

# SDK ceiling — why several deps are held back
# ---------------------------------------------
# CI pins Flutter 3.41.4 (Dart 3.11.1) for every platform except the Android job,
# which pins 3.38.7 (Dart 3.10.7). The ceiling exists because re_editor 0.8.0
# (pulled in by vendor/markdraw) breaks on Flutter >= 3.44. Do not float CI on `stable`.
#
# Consequence: anything needing Dart >= 3.12 / Flutter >= 3.44 is unreachable —
# pdf 3.13, printing 5.15, sqflite 2.4.3, sqflite_common_ffi 2.4.2, record 7.
# These unblock together once re_editor is resolved; they are not individually broken.
#
# Also: keep constraint FLOORS low. The Android job (Dart 3.10.7) ignores pubspec.lock
# and re-resolves, downgrading anything needing Dart 3.11 (e.g. add_2_calendar 3.1.1 ->
# 3.0.1, pdfrx -> the ^2.2.24 floor). Raising a floor to a Dart-3.11-only version makes
# that job unsolvable, since pub cannot downgrade below a declared floor.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1  # State management for chat runtime / streaming (perf re-architecture)
  dynamic_color: ^1.7.0  # Material You / system accent colour (Android 12+, some desktops)
  web: ^1.1.1
  shared_preferences: ^2.5.3
  http: ^1.5.0
  dio: ^5.4.0
  flutter_svg: ^2.2.2
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  uuid: ^4.5.2
  permission_handler: ^12.0.1
  supabase_flutter: ^2.10.3
  crypto: ^3.0.6
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.0.0
  share_plus: ^12.0.1  # 13.x blocked by file_picker 11 → win32 5 conflict
  package_info_plus: ^9.0.0  # 10.x blocked by file_picker 11 → win32 5 conflict
  record: ^6.1.2  # 7.x needs Dart ^3.12 / Flutter >=3.44 — see SDK ceiling note above.
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  markdown_widget: ^2.3.2+8
  google_fonts: ^8.0.2
  markdown: ^7.3.0
  flutter_math_fork: ^0.7.2
  highlight: ^0.7.0
  web_socket_channel: ^3.0.1
  archive: ^4.0.7
  yaml: ^3.1.3  # SKILL.md frontmatter — already in the tree via pdfrx
  desktop_drop: ^0.7.0
  tray_manager: ^0.5.1
  window_manager: ^0.5.1
  image: ^4.8.0  # 4.9.x needs xml ^7 — worth a try now that enough_mail is gone
  pdfx: ^2.8.0  # PDF viewing (mobile/macOS — used by workspace viewer)
  pdfrx: ^2.2.24  # Cross-platform PDF viewing incl. Linux/Windows (PDFium)
  pdf: ^3.11.0  # PDF generation (export markdown responses). 3.13.0 needs Dart >=3.12 — see SDK ceiling note above.
  printing: ^5.13.0  # Cross-platform PDF share/print/save. 5.15.0 needs Dart >=3.12 / Flutter >=3.41 — see SDK ceiling note above.
  flutter_foreground_task: ^10.0.0  # Keep streaming alive when app backgrounded
  # 10.0.0 is a floor-only major: no Dart API changes, no migration steps.
  # Needs Flutter >=3.38.0 — satisfied by both CI pins (android 3.38.7, rest 3.41.4).
  flutter_local_notifications: ^22.0.0  # Completion notifications with deep linking
  pasteboard: ^0.5.0
  flutter_map: ^8.3.0          # Map widget for displaying locations/routes
  maplibre: ^0.3.2             # 3D-capable interactive maps
  latlong2: ^0.10.1             # Coordinate math (LatLng type) — flutter_map 8.3.1 widened to >=0.9.1 <0.11.0
  fl_chart: ^1.1.1              # Chart rendering (bar, line, pie, scatter, radar)
  # 14.0.3 -> geolocator_linux ^0.2.6 -> package_info_plus ^10 -> win32 ^6,
  # but file_picker 11.0.2 (latest) pins win32 ^5.9.0. Unblocks only when file_picker ships win32 6.
  geolocator: ^14.0.2
  add_2_calendar: ^3.0.1        # Native calendar event creation
  timezone: ^0.11.0             # Timezone data for notifications
  pretty_qr_code: ^3.6.0
  sqflite: ^2.4.2  # 2.4.3 needs Dart ^3.12 / Flutter >=3.44 — see SDK ceiling note above.
  sqflite_common_ffi: ^2.4.0+2  # 2.4.2 needs Dart ^3.12 — see SDK ceiling note above.
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
  # System-WebView renderer for HTML artifacts on
  # Android/iOS/macOS/Windows/Web. Linux has no stable federation for
  # this plugin, so the desktop Linux build falls back to a source view.
  # A separate "-full" Linux artifact built via CI injects `webview_cef`
  # (CEF/Chromium) for real HTML rendering. See .github/workflows and
  # ci/linux_full/ for the swap-in files.
  flutter_inappwebview: ^6.1.5
  # Native cross-platform Excalidraw-compatible drawing widget. Replaces
  # the old WebView-based renderer — works on every Flutter platform
  # without bundling Chromium or shipping the official Excalidraw bundle.
  #
  # Vendored from pub.dev markdraw 0.2.0 (see vendor/markdraw/). Patched
  # to relax file_picker / google_fonts constraints and to no-op
  # MarkdrawFileHandler (incompatible with file_picker ^11 API). Upgrading
  # markdraw requires re-vendoring + re-applying these patches.
  markdraw:
    path: vendor/markdraw

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/wordmark.svg
    - assets/icons/
    - assets/icons/chuk_chat_tray_brand.png
    - web/icons/Icon-512.png
    - windows/runner/resources/app_icon.ico

msix_config:
  display_name: chuk_chat
  publisher_display_name: chuk Development
  identity_name: chuk.chat
  publisher: CN=chuk Development
  msix_version: 1.0.0.0
  logo_path: web/icons/Icon-512.png
  capabilities: internetClient
  store: false
