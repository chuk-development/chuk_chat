name: cowork
description: "Chuk Chat — AI chat client for all platforms."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Material motion: the container transform that grows a chat out of its
  # inbox row, and the shared-axis transition between filters. Used by the
  # expressive UI layer (lib/ui/expressive/**).
  animations: ^2.0.11

  # Security stack (ported from chuk_chat — see Appendix A of the plan).
  supabase_flutter: ^2.10.3
  cryptography: ^2.7.0
  crypto: ^3.0.6
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.1
  uuid: ^4.5.2
  http: ^1.5.0
  dio: ^5.4.0

  # Opens the connector legal pages (Terms / Privacy) in the browser from the
  # MCP connectors screen. Same version chuk_chat pins.
  url_launcher: ^6.3.0

  # Markdown rendering for agent replies (same renderer as chuk_chat).
  markdown_widget: ^2.3.2+8

  # Where a file the agent produced is written when the user saves it.
  path_provider: ^2.1.6
  # Vendored fork of flutter_rfb 0.6.2 (third_party/flutter_rfb): the clipboard
  # sync is stripped out so the VNC tunnel carries strictly RFB derived from
  # user input + the render loop — no local-clipboard exfil into the sandbox and
  # no writing the sandbox clipboard back onto the host. dart_rfb stays from pub.
  flutter_rfb:
    path: third_party/flutter_rfb
  # Direct dependency so app tests can exercise the Tight decoder
  # (third_party/dart_rfb) against real x11vnc vectors.
  dart_rfb:
    path: third_party/dart_rfb

  # --- WS-0 foundations: verbatim chuk_chat UI import ------------------------
  # Constraints copied from chuk_chat/pubspec.yaml where they exist. The caps
  # below are load-bearing (chuk_chat's own comments explain why); do not widen
  # them without re-reading that file.
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations; `any` lets pub pick the matching build.
  intl: any
  flutter_svg: ^2.2.2
  # Held below 2.0.0: dynamic_color 2.x hands its palette back as a
  # `material_ui` ColorScheme, which does not match Flutter 3.47's own
  # ColorScheme, so DynamicColorBuilder's builder types stop matching.
  dynamic_color: ">=1.9.0 <2.0.0"
  web: ^1.1.1

  # --- Deps the chat-UI import (WS-5/WS-6) and notifications (WS-7) need -----
  # Landed here so pubspec.yaml is touched once, not per work stream.
  archive: ^4.0.7
  desktop_drop: ^0.8.0
  file_picker: ^12.0.0
  fl_chart: ^1.1.1
  flutter_map: ^8.3.0
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  flutter_math_fork: ^0.7.2
  highlight: ^0.7.0
  image: ^4.8.0
  image_picker: ^1.1.2
  markdown: ^7.3.0
  pasteboard: ^0.5.0
  pdfrx: ^2.2.24
  pdfx: ^2.8.0
  # Held at 12.x: permission_handler 13.x pulls permission_handler_android
  # 14.0.0, which hardcodes compileSdk 37.
  permission_handler: ">=12.0.1 <13.0.0"
  record: ^7.1.1
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.0.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3

  # --- Local chat cache: SQLite on native, same versions as chuk_chat --------
  # chuk_chat/lib/services/local_chat_cache_native.dart is imported verbatim
  # (bead cowork-sha). It calls sqfliteFfiInit() itself on Linux/Windows.
  sqflite: ^2.4.3  # local chat cache (native platforms)
  sqflite_common_ffi: ^2.4.2  # SQLite on desktop (Linux/Windows/macOS)
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icons/

  # The three selectable chat fonts, bundled locally (chuk_chat's block,
  # imported verbatim). Arimo and JetBrains Mono are variable fonts (the wght
  # axis covers every weight); Merriweather ships as static weights.
  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-wght.ttf
        - asset: assets/fonts/Arimo-Italic-wght.ttf
          style: italic
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-wght.ttf
        - asset: assets/fonts/JetBrainsMono-Italic-wght.ttf
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
