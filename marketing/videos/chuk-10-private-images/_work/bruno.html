      <feComposite in="d" in2="blot" operator="in" result="pig"/>
      <feMorphology in="d" operator="erode" radius="5" result="inner"/>
      <feComposite in="d" in2="inner" operator="out" result="rim"/>
      <feGaussianBlur in="rim" stdDeviation="1.6" result="rimb"/>
      <feColorMatrix in="rimb" type="matrix" values="0.75 0 0 0 0  0 0.75 0 0 0  0 0 0.75 0 0  0 0 0 0.55 0" result="rimd"/>
      <feMerge><feMergeNode in="pig"/><feMergeNode in="rimd"/></feMerge>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">

    <filter id="fine" x="-20%" y="-20%" width="140%" height="140%">

      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- cold-press paper -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2" result="t"/>
      <feDiffuseLighting in="t" lighting-color="#ffffff" surfaceScale="1.4" result="l">

      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.28  -0.9 0 0 0 0.9"/>
