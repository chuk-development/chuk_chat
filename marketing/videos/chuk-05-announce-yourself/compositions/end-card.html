<!doctype html>
<!--
  Chuk Chat end card — reusable. Logo, "Chuk Chat", "Private and Secure. Always.",
  "chuk.chat". Transparent by default so the sky of the window composition
  shows through; set ground to "paper" for a warm-paper card.
-->
<html
  data-composition-variables='[
    {"id":"ground","type":"enum","label":"Ground","default":"transparent","options":[{"value":"transparent","label":"Transparent"},{"value":"paper","label":"Paper"}]},
    {"id":"land_at","type":"number","label":"Lockup lands at (s)","default":0.5,"min":0,"max":5,"step":0.1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <style>
        @font-face { font-family: "Chuk Chat Mono"; src: url("assets/fonts/ChukChatMono-wght.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: block; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/InterVariable.ttf") format("truetype"); font-weight: 100 900; font-style: normal; font-display: block; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #ec-ground { position: absolute; inset: 0; background: #FDFBF7; opacity: 0; }
        #ec-lockup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #26251F; }
        #ec-brand { display: flex; align-items: center; gap: 30px; }
        #ec-logo { width: 128px; height: 128px; display: block; }
        #ec-name { font-family: "Chuk Chat Mono", monospace; font-size: 112px; font-weight: 700; letter-spacing: -3px; line-height: 1; }
        #ec-slogan { margin: 44px 0 0; font-family: "Inter", sans-serif; font-size: 88px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; white-space: nowrap; }
        #ec-url { margin: 44px 0 0; padding: 12px 34px; border: 2px solid rgba(38, 37, 31, 0.28); border-radius: 999px; background: rgba(253, 251, 247, 0.72); font-family: "Chuk Chat Mono", monospace; font-size: 40px; font-weight: 600; letter-spacing: 0.01em; color: #26251F; }
      </style>
      <div id="root" data-composition-id="end-card" data-width="1920" data-height="1080">
        <div id="ec-ground" class="clip" data-start="0" data-duration="6.5" data-track-index="0"></div>
        <div id="ec-lockup" class="clip" data-start="0" data-duration="6.5" data-track-index="1">
          <div id="ec-brand">
            <svg id="ec-logo" viewBox="0 0 500 500" aria-hidden="true"><g transform="translate(0,500) scale(0.1,-0.1)" fill="#26251F"><path d="M2365 4644 c-123 -17 -233 -41 -310 -66 -641 -213 -1147 -829 -1251 -1521 -20 -136 -20 -368 1 -493 79 -468 376 -837 785 -977 135 -46 265 -67 418 -67 208 0 366 34 609 131 88 35 103 44 107 67 6 27 106 651 106 659 0 2 -30 -20 -67 -50 -141 -112 -280 -186 -428 -229 -117 -33 -319 -33 -425 0 -123 39 -187 78 -285 177 -76 75 -99 106 -138 185 -60 120 -86 224 -94 370 -11 213 35 416 141 636 66 135 146 243 257 350 139 132 288 219 444 260 100 26 316 26 405 0 148 -44 273 -123 361 -228 29 -35 51 -54 54 -46 11 35 105 663 100 675 -11 31 -223 116 -370 149 -67 15 -353 27 -420 18z"/><path d="M2758 3464 c-89 -16 -231 -60 -375 -115 -89 -35 -102 -43 -107 -67 -6 -28 -106 -651 -106 -659 0 -3 21 14 47 37 115 101 302 201 453 242 69 19 109 23 215 22 220 -1 342 -52 495 -204 70 -70 94 -102 133 -180 72 -144 90 -224 91 -410 0 -92 -5 -185 -13 -229 -30 -167 -114 -372 -211 -517 -73 -108 -235 -269 -340 -336 -170 -109 -284 -142 -485 -142 -133 0 -145 1 -238 33 -120 41 -239 121 -315 210 -30 36 -54 56 -57 49 -11 -34 -105 -663 -101 -674 11 -29 183 -102 331 -140 82 -21 131 -27 265 -31 261 -8 455 32 690 144 213 100 438 271 600 454 241 273 414 639 465 986 21 141 21 375 -1 501 -91 539 -471 940 -973 1026 -116 20 -354 20 -463 0z"/></g></svg>
            <span id="ec-name">Chuk Chat</span>
          </div>
          <p id="ec-slogan">Private and Secure. Always.</p>
          <p id="ec-url">chuk.chat</p>
        </div>
      </div>
      <script>
        (function () {
          const ID = "end-card";
          const ROOT = document.querySelector('[data-composition-id="' + ID + '"]');
          const q = (s) => ROOT.querySelector(s);
          const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
          const at = V.land_at != null ? Number(V.land_at) : 0.5;
          const tl = gsap.timeline({ paused: true });
          if (V.ground === "paper") tl.fromTo(q("#ec-ground"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo(q("#ec-logo"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, at);
          tl.fromTo(q("#ec-name"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, at);
          tl.fromTo(q("#ec-slogan"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, at + 0.5);
          tl.fromTo(q("#ec-url"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, at + 1.0);
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
