  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const PLAN = /*PLAN*/;
      const tl = gsap.timeline({ paused: true });

      // camera: one fromTo per key, each starting where the previous key ended
      const cam0 = PLAN.cam[0];
      gsap.set("#r-cam", { x: cam0.x, y: cam0.y, scale: cam0.s });
      for (let i = 1; i < PLAN.cam.length; i++) {
        const a = PLAN.cam[i - 1];
        const b = PLAN.cam[i];
        tl.fromTo(
          "#r-cam",
          { x: a.x, y: a.y, scale: a.s },
          { x: b.x, y: b.y, scale: b.s, duration: b.d, ease: b.ease, immediateRender: false },
          b.t
        );
      }

      // handheld tilt around the frame centre (life, not a move)
      gsap.set("#r-tilt", { rotation: PLAN.tilt[0][3] });
      for (let i = 1; i < PLAN.tilt.length; i++) {
        const a = PLAN.tilt[i - 1];
        const b = PLAN.tilt[i];
        tl.fromTo("#r-tilt", { rotation: a[3] }, { rotation: b[3], duration: b[1], ease: b[2], immediateRender: false }, b[0]);
      }

      // paper feed: stepper jerks, one row per beat
      gsap.set("#r-feed", { y: PLAN.initialTop });
      let prevY = PLAN.initialTop;
      for (const f of PLAN.feeds) {
        tl.fromTo(
          "#r-feed",
          { y: prevY },
          { y: f.y, duration: f.d, ease: "power2.inOut", immediateRender: false },
          f.t
        );
        prevY = f.y;
      }

      // leader dots tick in on the grid
      for (const rid of Object.keys(PLAN.dots)) {
        const el = document.getElementById("r-dots-" + rid);
        const n = el.textContent.length;
        const times = PLAN.dots[rid];
        times.forEach(function (t, i) {
          const k = Math.ceil((n * (i + 1)) / times.length);
          tl.set(el, { clipPath: "inset(0% " + (((n - k) / n) * 100).toFixed(3) + "% 0% 0%)" }, t);
        });
      }

      // the zeros stamp in
      for (const rid of Object.keys(PLAN.stamps)) {
        const el = document.getElementById("r-val-" + rid);
        tl.fromTo(
          el,
          { opacity: 0, scale: 1.35, filter: "blur(3px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.09, ease: "power2.out", immediateRender: false },
          PLAN.stamps[rid]
        );
      }

      // the tear
      const T = PLAN.tear;
      tl.fromTo("#r-tear", { rotation: 0, y: 0, x: 0 }, { rotation: -3.2, y: -18, x: -4, duration: 0.08, ease: "power2.out", immediateRender: false }, T);
      tl.fromTo("#r-tear", { y: -18, x: -4 }, { y: -PLAN.lift, x: 8, duration: 0.42, ease: "power3.out", immediateRender: false }, T + 0.08);
      tl.fromTo("#r-tear", { rotation: -3.2 }, { rotation: -1.4, duration: 0.7, ease: "power2.inOut", immediateRender: false }, T + 0.08);
      tl.fromTo("#r-lipshade", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.out", immediateRender: false }, T + 0.06);
      tl.fromTo("#r-printer", { y: 0 }, { y: 1300, duration: 0.8, ease: "power2.in", immediateRender: false }, T + 0.2);
      tl.fromTo("#r-curl", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out", immediateRender: false }, T + 0.3);

      window.__timelines["03-receipt"] = tl;
    })();
  </script>
