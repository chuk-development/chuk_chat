  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // seeded starfield (deterministic)
      let seed = 20260927;
      function rnd() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      const stars = document.getElementById("h-stars");
      for (let i = 0; i < 240; i++) {
        const s = document.createElement("div");
        s.className = "h-star";
        const size = 1 + rnd() * rnd() * 4;
        s.style.left = (rnd() * 1920).toFixed(1) + "px";
        s.style.top = (rnd() * 1080).toFixed(1) + "px";
        s.style.width = size.toFixed(2) + "px";
        s.style.height = size.toFixed(2) + "px";
        s.style.opacity = (0.35 + rnd() * 0.65).toFixed(2);
        stars.appendChild(s);
      }

      const tl = gsap.timeline({ paused: true });
      const STOP = 3.4;

      // frame 0: flash decays, stars already warping
      tl.fromTo("#h-flash", { opacity: 0.38 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#h-stars", { scale: 1 }, { scale: 1.9, duration: STOP, ease: "power1.in" }, 0);
      tl.fromTo("#h-neb1", { rotation: 0, scale: 1 }, { rotation: 14, scale: 1.12, duration: STOP, ease: "none" }, 0);
      tl.fromTo("#h-neb2", { rotation: 0, scale: 1 }, { rotation: -10, scale: 1.1, duration: STOP, ease: "none" }, 0);
      tl.fromTo("#h-neb3", { scale: 0.9, opacity: 0.6 }, { scale: 1.15, opacity: 1, duration: STOP, ease: "none" }, 0);
      tl.fromTo("#h-kicker", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 0);

      // the two slams
      tl.fromTo("#h-l1w", { scale: 1.9, opacity: 0.55, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0);
      tl.fromTo("#h-l2w", { scale: 2.6, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "power4.out" }, 0.5);
      // trailer shake on each slam
      [0.2, 0.62].forEach(function (t0) {
        const xs = [16, -12, 8, -5, 2, 0];
        let px = 0;
        xs.forEach(function (x, i) {
          tl.fromTo("#h-text", { x: px }, { x: x, duration: 0.03, ease: "none", immediateRender: false }, t0 + i * 0.03);
          px = x;
        });
      });
      tl.fromTo("#h-sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);

      // anamorphic lens flare sweeps across the headline
      const C = { x: 960, y: 540 };
      const P0 = { x: 240, y: 430 };
      const P1 = { x: 1680, y: 468 };
      const sweep = { t: 0.3, d: 2.9, ease: "power1.inOut" };
      const els = [
        ["#h-streak2", 0],
        ["#h-streak", 0],
        ["#h-ring", 0],
        ["#h-core", 0],
        ["#h-g1", 0.6],
        ["#h-g2", 1.1],
        ["#h-g3", 1.7]
      ];
      els.forEach(function (e) {
        const k = e[1];
        const a = k === 0 ? P0 : { x: C.x + k * (C.x - P0.x), y: C.y + k * (C.y - P0.y) };
        const b = k === 0 ? P1 : { x: C.x + k * (C.x - P1.x), y: C.y + k * (C.y - P1.y) };
        tl.fromTo(e[0], { x: a.x, y: a.y, xPercent: -50, yPercent: -50 }, { x: b.x, y: b.y, xPercent: -50, yPercent: -50, duration: sweep.d, ease: sweep.ease }, sweep.t);
      });
      tl.fromTo("#h-flare", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.3);
      tl.fromTo("#h-core", { scale: 0.7 }, { scale: 1.25, duration: 0.7, ease: "power2.out" }, 0.3);
      tl.fromTo("#h-core", { scale: 1.25 }, { scale: 0.95, duration: 1.2, ease: "sine.inOut", immediateRender: false }, 1.0);

      // slow push-in
      tl.fromTo("#h-stage", { scale: 1 }, { scale: 1.07, duration: STOP - 0.3, ease: "none" }, 0.3);

      // record stop: everything sags, drains and dies
      tl.fromTo("#h-stage", { y: 0, rotation: 0, filter: "saturate(1) brightness(1)" }, { y: 90, rotation: 2.6, filter: "saturate(0.1) brightness(0.36)", duration: 0.4, ease: "power2.in", immediateRender: false }, STOP);
      tl.fromTo("#h-text", { scaleY: 1 }, { scaleY: 0.88, duration: 0.4, ease: "power2.in", immediateRender: false }, STOP);
      tl.fromTo("#h-flare", { opacity: 1 }, { opacity: 0.2, duration: 0.4, ease: "power2.in", immediateRender: false }, STOP);

      window.__timelines["01-hype"] = tl;
    })();
  </script>
