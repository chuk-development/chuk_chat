<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="./viewer.css">
</head>
<body>
<!-- The desktop's own box. The viewer resizes and offsets THIS element to
     zoom and pan; it never puts a CSS transform on it. -->
<div id="screen"></div>
<!-- Where the last painted desktop is parked while the socket re-handshakes. -->
<div id="held"></div>
<!-- The trackpad overlay, off by default. -->
<div id="trackpad" hidden></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
