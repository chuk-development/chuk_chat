name: Deploy Web (Tag-triggered)

# Triggers when a version tag is pushed (e.g. v1.0.43)
# Tags are created automatically by the Cross-Platform Build workflow,
# or manually via: git tag v1.0.XX && git push origin v1.0.XX
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy-web:
    name: Trigger Web Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying web for tag: $TAG"

      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL secret is not set."
            echo "Add it under Settings → Secrets → Actions with your Dokploy webhook URL."
            exit 1
          fi

          echo "Triggering Dokploy rebuild for ${{ steps.version.outputs.tag }}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$DOKPLOY_WEBHOOK_URL")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Dokploy webhook triggered successfully (HTTP $HTTP_STATUS)"
          else
            echo "::error::Dokploy webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi
