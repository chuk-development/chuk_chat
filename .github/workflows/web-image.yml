name: Web image

# chat.chuk.chat is built by Dokploy from Dockerfile.web on every push to
# master. A failed build there leaves the previous container running, so the
# site keeps serving the old app and nothing reports it. This workflow builds
# the same image on the runner, so a broken web build fails visibly here first.

# Read-only: this workflow builds, it never publishes.
permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile.web'
      - '.dockerignore'
      - 'nginx.web.conf'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'vendor/**'
      - '.github/workflows/web-image.yml'
      # Every file the pin check reads, so a drifting pin cannot slip in.
      - 'scripts/check_flutter_pins.sh'
      - 'dev.chuk.chat.yml'
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/release-macos.yml'
      - '.github/workflows/build-cross-platform.yml'
  pull_request:
    # The same list as above: a pull request that changes any of it can break
    # the image just as well.
    paths:
      - 'Dockerfile.web'
      - '.dockerignore'
      - 'nginx.web.conf'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'vendor/**'
      - '.github/workflows/web-image.yml'
      - 'scripts/check_flutter_pins.sh'
      - 'dev.chuk.chat.yml'
      - '.github/workflows/release-windows.yml'
      - '.github/workflows/release-macos.yml'
      - '.github/workflows/build-cross-platform.yml'
  workflow_dispatch:

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Flutter pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check_flutter_pins.sh

  build:
    name: Build the web image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          push: false
          build-args: |
            SUPABASE_URL=https://example.invalid
            SUPABASE_ANON_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
