name: CI

# Static analysis and the unit tests on every pull request and every push to
# master. No secrets: the tests run without Supabase credentials.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with every other build path; scripts/check_flutter_pins.sh
  # reads this line and fails on drift.
  FLUTTER_VERSION: '3.47.0'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Pin check + flutter analyze. The same script runs in the pre-push
      # hook (.beads/hooks/pre-push), so local and CI cannot drift. The
      # paths and the fatal levels are explained in the script.
      - name: Analyze
        run: ./scripts/ci_analyze.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1

      # flutter test runs on the flutter-tester, whose native-assets build
      # (irondash cnativeapi via super_native_extensions) needs the GTK 3,
      # X11 and Xi headers: pkg-config --cflags gtk+-3.0 x11 xi.
      - name: Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake ninja-build \
            libgtk-3-dev libx11-dev libxi-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Test (shard ${{ matrix.shard }} of 4)
        run: >
          flutter test
          --total-shards 4 --shard-index ${{ matrix.shard }}
          --reporter expanded

  # Duplicate-code report for lib/ (.jscpd.json: 60 tokens, 6 lines, mild).
  # Advisory: it lists clones in the job log and never fails the run. Make it
  # blocking only after the existing clones are cleaned up or marked with
  # `// jscpd:ignore-start` / `// jscpd:ignore-end` and a reason.
  duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      # ubuntu-latest ships Node and npx; no setup step needed.
      - name: jscpd (advisory)
        run: npx --yes jscpd@4 --config .jscpd.json
