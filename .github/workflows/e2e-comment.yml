name: E2E comment

# Posts the screenshots of an E2E run as ONE sticky pull request comment.
#
# Why workflow_run: the E2E workflow runs code from the pull request (also
# from forks) with a read-only token. This workflow runs the version from
# the default branch, with a write token, and never checks out or executes
# pull request code. It only reads the artifact (PNG files), checks each
# file (name, size, PNG signature) and treats it as data.
#
# The images go to the orphan branch "e2e-shots" (one commit, force-pushed
# with a lease), so raw.githubusercontent.com can serve them to the comment:
#   master/<file>.png              baseline from the last green master run
#   pr/<number>/<run id>/<file>    the last run of each open pull request
# See docs/E2E_CI.md.

on:
  workflow_run:
    workflows: [E2E]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read         # download the artifact of the E2E run
      contents: write       # push the e2e-shots branch
      pull-requests: write  # the sticky comment
      issues: write         # PR comments use the issues API
    steps:
      # Trusted code only: the default branch of this repository.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the screenshots
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: e2e-shots
          path: ${{ runner.temp }}/e2e-shots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish the screenshots and the comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOTS_DIR: ${{ runner.temp }}/e2e-shots
          WORK_DIR: ${{ runner.temp }}/e2e-shots-branch
          ARTIFACT_OK: ${{ steps.download.outcome == 'success' }}
        run: node .github/scripts/e2e_shots_comment.cjs
