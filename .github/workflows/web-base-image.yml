name: Web base image

# Publishes ghcr.io/chuk-development/chuk-chat-web-base:<FLUTTER_VERSION>, the
# base of Dockerfile.web. It holds the Flutter SDK, the web artifacts and a
# pub cache warmed with the current pubspec.lock, so a Dokploy deploy of
# chat.chuk.chat only compiles the app. See Dockerfile.web-base.
#
# A pubspec.lock change does NOT rebuild it on purpose: the pub cache layer is
# ~570 MB, and the server would pull it again for every dependency bump. A
# stale cache only means `flutter pub get` downloads the changed packages.
# Run the workflow by hand now and then to refresh the cache.
#
# The package must stay public: Dokploy pulls it without credentials.

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile.web-base'
      - 'Dockerfile.web'
      - '.github/workflows/web-base-image.yml'
  workflow_dispatch:

concurrency:
  group: web-base-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push the base image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Dockerfile.web is the single place that names the Flutter version.
      - name: Flutter version
        id: flutter
        run: |
          version="$(grep -oP '^(ARG|ENV) FLUTTER_VERSION=\K[0-9.]+' Dockerfile.web)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.web-base
          push: true
          build-args: FLUTTER_VERSION=${{ steps.flutter.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/chuk-chat-web-base:${{ steps.flutter.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/chuk-chat-web-base:latest
          cache-from: type=gha,scope=web-base
          cache-to: type=gha,scope=web-base,mode=max
