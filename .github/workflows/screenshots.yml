# Keeps the store screenshots in step with the UI.
#
# `flutter test test_screenshots` renders the app's own widgets headlessly, so
# this job needs no emulator, no signing key and no Supabase credentials — it
# is the cheapest workflow in the repo. The output tree,
# `fastlane/metadata/android/`, is what F-Droid reads directly out of the
# repository and what `fastlane supply` uploads to Play.
#
# The commit it pushes only touches that tree, which is not in the path filter
# below, so it cannot trigger itself.
name: Screenshots
# Actions are pinned to full commit SHAs, not tags: a tag is mutable, and both
# workflows handle something a moved tag could reach — this one holds
# `contents: write` and pushes; the Play workflow writes the upload keystore
# and the Play service-account key into the workspace.

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'assets/fonts/**'
      - 'test_screenshots/**'
      - 'pubspec.yaml'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the result back to master'
        required: false
        default: true
        type: boolean

jobs:
  screenshots:
    name: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - run: flutter pub get

      - name: Render the listing images
        run: flutter test test_screenshots

      # Play and F-Droid both reject an oversized title or description at
      # upload time. Catch it here instead.
      - name: Check the listing against the store limits
        run: flutter test test/fastlane_metadata_test.dart

      - name: Commit if anything changed
        if: github.event_name == 'push' || inputs.commit
        run: |
          if git diff --quiet -- fastlane/metadata; then
            echo "Screenshots unchanged."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add fastlane/metadata
          git commit -m 'chore(store): regenerate listing screenshots [skip ci]'
          git push

      - name: Upload the images as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-listing-images
          path: fastlane/metadata/android/*/images/**
          if-no-files-found: error
