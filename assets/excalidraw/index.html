<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP locks the shell down to the assets we ship.
      - default-src 'self': no external fetches
      - 'unsafe-inline' on style is required by Excalidraw's runtime
        theme tokens, but not allowed for scripts.
      - data: images: Excalidraw embeds inline data-URI icons.
      - blob: images: used by Excalidraw for export + copy flows.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors *"
    />
    <title>Excalidraw</title>
    <link rel="stylesheet" href="bundle.css" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #ffffff;
        overflow: hidden;
      }
      /* Flutter's InAppWebView rounds edges on some platforms; force a
         predictable background so initial paint doesn't flash grey. */
      body {
        color: #1e1e1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      .chuk-excalidraw-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-size: 13px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="chuk-excalidraw-loading">Loading Excalidraw…</div>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
