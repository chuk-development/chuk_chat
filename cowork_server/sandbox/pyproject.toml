[project]
name = "cowork-sandbox"
version = "0.1.0"
description = "CoWork execution sandbox: BaseEnvironment ABC + snapshot-file session persistence, local and docker backends."
readme = "README.md"
authors = [
    { name = "chukfinley", email = "chuk@chuk.dev" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
